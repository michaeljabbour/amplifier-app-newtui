[package]
name = "amplifier-newtui-rs"
version = "0.1.0"
edition = "2021"
description = "Ratatui MVP of the Amplifier TUI experience — self-contained, no Python."

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
rust_decimal = { version = "1.42.1", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "amplifier-newtui-rs"
path = "src/main.rs"
