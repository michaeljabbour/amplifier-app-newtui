[project]
name = "amplifier-app-tui"
version = "0.1.0"
description = "Full-screen Textual TUI for the Amplifier AI development platform (v3 Cohesive)"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Microsoft MADE:Explorations Team" }]
dependencies = [
    "textual~=8.2",
    "amplifier-core>=1.6.0",
    "amplifier-foundation",
    # team_pulse_lib is the unpublished peer that tool-team-pulse (composed by
    # the packaged tui bundle) imports at mount(). The bundle installs it via
    # a root shim; tui pulls only the module subdir, so we install the lib
    # here — without it, tool-team-pulse fails to mount on a clean env (it is
    # meant to degrade gracefully, not hard-fail). Retire once it hits PyPI.
    "team-pulse-lib",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "pyyaml>=6.0.3",
    "filelock>=3.29.6",
    "httpx[socks]>=0.28.1",
]

[project.scripts]
amplifier-tui = "amplifier_app_tui.main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_app_tui"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest-textual-snapshot>=1.0.0",
    "ruff>=0.12.0",
]

[tool.uv.sources]
# Keep this at or after foundation 1a408839: the default bundle deliberately
# pins modules to full commit SHAs, which older source handlers passed to
# `git clone --branch` and therefore could not install from a cold cache.
amplifier-foundation = { git = "https://github.com/microsoft/amplifier-foundation", rev = "dea5bd8fe11a7617dbcfc61c47f9f4f2fdc0b134" }
team-pulse-lib = { git = "https://github.com/microsoft/amplifier-bundle-team-pulse", rev = "e89574d2b90814a0c10a2164aa7d5c9cc43bd3ce", subdirectory = "team-pulse-lib" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# The forge capability tier (tests/forge/, issue #49) is opt-in: it needs a
# real PTY + the forge daemon, so it is excluded from the default gate and CI.
# Run it with: uv run pytest -q -m forge tests/forge/
addopts = "--import-mode=importlib -m 'not forge'"
asyncio_mode = "strict"
markers = [
    "forge: real-PTY capability tier via amplifier-skill-forge (opt-in; needs a PTY + forge daemon; excluded from the default gate)",
]

[tool.pyright]
include = ["src", "tests", "sdk/python/src"]
extraPaths = ["sdk/python/src"]
venvPath = "."
venv = ".venv"
exclude = ["**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Enforce the codebase's blind-except convention (issue #29). ``BLE`` is
# added on top of ruff's default E/F rules; every broad catch that
# survives is a reviewed, justified ``# noqa: BLE001`` (crash-isolation,
# best-effort cleanup, fail-closed, or a display/boot resilience boundary).
extend-select = ["BLE"]
