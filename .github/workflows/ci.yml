name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a content-verified commit SHA, not a floating tag
      # (compliance B9): a tag can be moved/retargeted; a SHA cannot. Re-verify
      # via `git ls-remote --tags <repo>` before bumping either version comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright src/
      # Coverage tracing slows rendering enough to blow the 16ms frame budget
      # and perturb snapshot timing on CI runners, so the perf and snapshot
      # tests run uninstrumented in their own step (coverage is 89% either way).
      - run: uv run pytest -q --cov=src/amplifier_app_tui --cov-report=term --cov-fail-under=85
          --ignore=tests/test_perf_spike.py --ignore=tests/test_ui_snapshots.py
      - run: uv run pytest -q tests/test_perf_spike.py tests/test_ui_snapshots.py
